<style>
    html { font-size: 19px; }
    :root {
        --bg-body: #f1f5f9; --bg-card: #ffffff; --text-main: #0f172a;
        --border-color: #cbd5e1; --mid: #475569;
    }
    .dark {
        --bg-body: #050505; --bg-card: #0a0a0f; --text-main: #f8fafc;
        --border-color: #1a1a24; --mid: #94a3b8;
    }
    body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-body); color: var(--text-main); transition: background-color .3s, color .3s; }
    .card-base { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 1rem; transition: all .3s cubic-bezier(.4,0,.2,1); }
    .dark .card-base { box-shadow: 0 4px 20px -2px rgba(0,240,255,.03); border: 1px solid rgba(0,240,255,.08); }
    .text-mid-contrast { color: var(--mid); }
    .text-high-contrast { color: var(--text-main); }
    .news-card { transition: all .4s cubic-bezier(.175,.885,.32,1.275); border-left-width: 4px; }
    .news-card:hover { transform: translateY(-6px) scale(1.015); box-shadow: 0 25px 50px -12px rgba(15,23,42,.2); }
    .dark .news-card:hover { box-shadow: 0 15px 40px -5px rgba(255,183,0,.25); }
    .badge-利多 { background: rgba(0,255,136,.12); color: #059669; border: 1px solid rgba(0,255,136,.3); font-weight: 800; }
    .dark .badge-利多 { color: #00ff88; }
    .badge-利空 { background: rgba(255,0,85,.1); color: #dc2626; border: 1px solid rgba(255,0,85,.25); font-weight: 800; }
    .dark .badge-利空 { color: #ff5588; }
    .badge-中立 { background: rgba(148,163,184,.15); color: #475569; border: 1px solid rgba(148,163,184,.3); font-weight: 800; }
    .dark .badge-中立 { color: #94a3b8; }
    .preset-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .dark .preset-btn.active { background: #00f0ff; color: #050505; border-color: #00f0ff; }

    /* 緊湊/格狀檢視切換 — 與 daily_report.html 邏輯一致 */
    #newsContainer.compact-view { grid-template-columns: 1fr !important; gap: 3px !important; }
    #newsContainer.compact-view .news-card { padding: 0.625rem 1rem !important; border-radius: 0.5rem !important; }
    #newsContainer.compact-view .news-card h3 { font-size: 0.875rem !important; margin-bottom: 0.375rem !important; }
    #newsContainer.compact-view .card-body { display: none !important; }
    #newsContainer.compact-view .news-card > div:last-child { margin-top: 0 !important; }

    .spinner { border: 3px solid rgba(148,163,184,.25); border-top-color: #00f0ff; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

                    <option value="en">English</option>
                    <option value="th">ภาษาไทย</option>
                    <option value="hi">हिन्दी</option>

            </button>
        </div>
    </div>

    <!-- Range picker bar -->
    <div id="rangeBar" class="flex flex-wrap items-center gap-3 mb-4 card-base px-4 sm:px-5 py-3 sm:py-4">
        <span class="text-[10px] font-mono font-black uppercase tracking-widest text-mid-contrast flex items-center gap-2">
            <i class="fa-solid fa-calendar-days text-blue-500 dark:text-neon-cyan"></i> <span data-i18n="pick-range">選擇區間</span>
        </span>
        <div class="relative">
            <input id="rangePicker" type="text" readonly placeholder="YYYY-MM-DD ~ YYYY-MM-DD"
                class="h-9 pl-8 pr-3 rounded-lg card-base font-mono font-black text-sm text-blue-600 dark:text-neon-cyan cursor-pointer outline-none border dark:border-neon-cyan/40 hover:border-blue-400 dark:hover:border-neon-cyan transition-all w-56">
            <i class="fa-regular fa-calendar absolute left-2.5 top-1/2 -translate-y-1/2 text-[10px] text-blue-400 dark:text-neon-cyan pointer-events-none"></i>
        </div>
        <div class="flex gap-1.5 flex-wrap">
            <button class="preset-btn card-base px-3 py-2 text-[11px] font-bold font-mono rounded-lg border dark:border-neon-cyan/20" data-days="7" data-i18n="preset-7">近 7 天</button>
            <button class="preset-btn card-base px-3 py-2 text-[11px] font-bold font-mono rounded-lg border dark:border-neon-cyan/20" data-days="30" data-i18n="preset-30">近 30 天</button>
            <button class="preset-btn card-base px-3 py-2 text-[11px] font-bold font-mono rounded-lg border dark:border-neon-cyan/20" data-days="90" data-i18n="preset-90">近 90 天</button>

                <input id="regionSearch" type="text" data-placeholder-i18n="region-search" placeholder="搜尋地區..." class="w-full mb-2 px-2 py-1.5 text-xs rounded-lg bg-slate-100 dark:bg-obsidian-900 border border-slate-200 dark:border-obsidian-600 outline-none text-high-contrast">

            </div>

            <i class="fa-solid fa-list text-sm" id="viewIcon"></i>
        </button>
        <button id="clearBtn" data-i18n="reset" class="ml-auto text-[11px] font-bold font-mono text-red-500 dark:text-neon-rose hover:underline">RESET()</button>

        </div>

            <div id="statSources" class="text-2xl font-black text-blue-600 dark:text-neon-cyan font-mono">0</div>

        <div class="spinner"></div> <span data-i18n="loading">載入中...</span>
    </div>

    </div>
</div>

<script>
    // ── 主題（與 daily_report.html 共用同一組 localStorage key）──

    (function initTheme() {
        const saved = localStorage.getItem('jili-theme');
        if (saved === 'light') document.body.classList.remove('dark');
        else document.body.classList.add('dark');
    })();
    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('jili-theme', isDark ? 'dark' : 'light');
        document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-yellow-500 dark:text-neon-gold' : 'fa-solid fa-moon text-blue-500';
    }

    // ── 緊湊/格狀檢視（與 daily_report.html 邏輯一致）──
    function toggleView() {
        const isCompact = document.getElementById('newsContainer').classList.toggle('compact-view');
        document.getElementById('viewIcon').className = isCompact ? 'fa-solid fa-grip text-sm' : 'fa-solid fa-list text-sm';
        localStorage.setItem('jili-range-view', isCompact ? 'compact' : 'grid');
    }
    if (localStorage.getItem('jili-range-view') === 'compact') {
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('newsContainer').classList.add('compact-view');

        '亞洲':{en:'Asia',th:'เอเชีย',hi:'एशिया'}, '美洲':{en:'The Americas',th:'ทวีปอเมริกา',hi:'अमेरिका महाद्वीप'},
        '歐洲':{en:'Europe',th:'ยุโรป',hi:'यूरोप'}, '北美':{en:'North America',th:'อเมริกาเหนือ',hi:'उत्तर अमेरिका'},
        '拉丁美洲':{en:'Latin America',th:'ละตินอเมริกา',hi:'लैटिन अमेरिका'}, '中東':{en:'Middle East',th:'ตะวันออกกลาง',hi:'मध्य पूर्व'},
        '巴基斯坦':{en:'Pakistan',th:'ปากีสถาน',hi:'पाकिस्तान'}, '尼泊爾':{en:'Nepal',th:'เนปาล',hi:'नेपाल'},
        '土耳其':{en:'Turkey',th:'ตุรกี',hi:'तुर्की'}, '阿根廷':{en:'Argentina',th:'อาร์เจนตินา',hi:'अर्जेंटीना'},
        '墨西哥':{en:'Mexico',th:'เม็กซิโก',hi:'मेक्सिको'}, '葡萄牙':{en:'Portugal',th:'โปรตุเกส',hi:'पुर्तगाल'},
        '西班牙':{en:'Spain',th:'สเปน',hi:'स्पेन'}, '義大利':{en:'Italy',th:'อิตาลี',hi:'इटली'},
        '荷蘭':{en:'Netherlands',th:'เนเธอร์แลนด์',hi:'नीदरलैंड'}, '波蘭':{en:'Poland',th:'โปแลนด์',hi:'पोलैंड'},
        '加拿大':{en:'Canada',th:'แคนาดา',hi:'कनाडा'}, '中國':{en:'China',th:'จีน',hi:'चीन'},
        '孟加拉':{en:'Bangladesh',th:'บังกลาเทศ',hi:'बांग्लादेश'}, '沙烏地阿拉伯':{en:'Saudi Arabia',th:'ซาอุดีอาระเบีย',hi:'सऊदी अरब'},
        '德國':{en:'Germany',th:'เยอรมนี',hi:'जर्मनी'}, '法國':{en:'France',th:'ฝรั่งเศส',hi:'फ्रांस'},
        '哥倫比亞':{en:'Colombia',th:'โคลอมเบีย',hi:'कोलंबिया'}, '紐西蘭':{en:'New Zealand',th:'นิวซีแลนด์',hi:'न्यूज़ीलैंड'},
        '南非':{en:'South Africa',th:'แอฟริกาใต้',hi:'दक्षिण अफ्रीका'}, '奈及利亞':{en:'Nigeria',th:'ไนจีเรีย',hi:'नाइजीरिया'},
        '非洲':{en:'Africa',th:'แอฟริกา',hi:'अफ्रीका'}, '南亞':{en:'South Asia',th:'เอเชียใต้',hi:'दक्षिण एशिया'},
        '東北亞':{en:'Northeast Asia',th:'เอเชียตะวันออกเฉียงเหนือ',hi:'पूर्वोत्तर एशिया'},
    };
    function getLocalRegion(cn) {
        if (!cn) return '';
        if (currentLang === 'cn') return cn;
        if (regionMap[cn]) return regionMap[cn][currentLang] || regionMap[cn].en || cn;
        for (const k of Object.keys(regionMap)) {
            if (cn.includes(k)) return regionMap[k][currentLang] || regionMap[k].en || cn;
        }
        return cn;
    }

    let currentLang = localStorage.getItem('jili-lang') || 'cn';
    const i18nMonthCache = {}; // month -> {url: {en:{t,s}, th:{...}, hi:{...}}}
    const translationsByUrl = {}; // 已載入翻譯的合併查找表

    function applyChromeI18n() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const val = i18n[currentLang][el.dataset.i18n];
            if (val) el.textContent = val;
        });
        document.querySelectorAll('[data-placeholder-i18n]').forEach(el => {
            const val = i18n[currentLang][el.dataset.placeholderI18n];
            if (val) el.placeholder = val;
        });
        const viewToggle = document.getElementById('viewToggle');
        if (viewToggle) viewToggle.title = i18n[currentLang]['toggle-view'];
        const sel = document.getElementById('langSelect');
        if (sel) sel.value = currentLang;
        document.title = i18n[currentLang]['page-title'];
        document.documentElement.lang = { cn:'zh-Hant', en:'en', th:'th', hi:'hi' }[currentLang] || 'zh-Hant';
    }

    async function loadI18nMonth(month) {
        if (i18nMonthCache[month]) return i18nMonthCache[month];
        try {
            const res = await fetch(`data/${month}.i18n.json`, { cache: 'no-store' });
            i18nMonthCache[month] = res.ok ? await res.json() : {};
        } catch (e) {
            i18nMonthCache[month] = {};
        }
        Object.assign(translationsByUrl, i18nMonthCache[month]);
        return i18nMonthCache[month];
    }

    async function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('jili-lang', lang);
        applyChromeI18n();
        if (lang !== 'cn' && currentMonths.length) {
            await Promise.all(currentMonths.map(loadI18nMonth));
        }
        renderRegionOptions(dateFilteredItems);
        applyRegionFilter();
    }

    function getTitle(item) {
        if (currentLang === 'cn') return item['中文標題'] || '';
        const t = translationsByUrl[item['連結']]?.[currentLang]?.t;
        return t || item['中文標題'] || '';
    }
    function getSummary(item) {
        if (currentLang === 'cn') return item['中文摘要'] || '';
        const s = translationsByUrl[item['連結']]?.[currentLang]?.s;
        return s || item['中文摘要'] || '';
    }
    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ── 資料載入（依月份分片抓取 output/data/*.json，快取避免重複請求）──
    const monthCache = {};
    let indexData = null;
    let currentMonths = [];

    function pad(n){ return String(n).padStart(2,'0'); }
    function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    function monthsBetween(startStr, endStr) {
        const months = [];
        let d = new Date(startStr.slice(0,7) + '-01');
        const endD = new Date(endStr.slice(0,7) + '-01');
        while (d <= endD) {
            months.push(d.getFullYear()+'-'+pad(d.getMonth()+1));
            d.setMonth(d.getMonth() + 1);
        }
        return months;
    }

    async function loadIndex() {
        // GitHub Pages 的 CDN 邊緣節點偶爾會有短暫的傳播延遲，剛好在部署後幾秒內
        // 讀取會 404；失敗時重試 2 次（間隔漸增）再放棄，避免使用者看到假性的「載入失敗」。
        let lastErr;
        for (let attempt = 0; attempt < 3; attempt++) {
            try {
                const res = await fetch('data/index.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('index fetch failed: ' + res.status);
                return await res.json();
            } catch (e) {
                lastErr = e;
                if (attempt < 2) await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
            }
        }
        throw lastErr;
    }
    async function loadMonth(month) {
        if (monthCache[month]) return monthCache[month];
        try {
            const res = await fetch(`data/${month}.json`, { cache: 'no-store' });
            monthCache[month] = res.ok ? await res.json() : [];
        } catch (e) {
            monthCache[month] = [];
        }
        return monthCache[month];
    }

    function renderCards(items) {
        const container = document.getElementById('newsContainer');
        const empty = document.getElementById('emptyState');
        container.innerHTML = '';
        empty.classList.toggle('hidden', items.length > 0);

        const sentimentLabel = { '利多': i18n[currentLang]['label-bullish'], '利空': i18n[currentLang]['label-bearish'], '中立': i18n[currentLang]['label-neutral'] };

        items.forEach(item => {
            const stars = Array.from({length: Math.min(Math.max(parseInt(item['重要性']) || 1, 1), 5)})
                .map(() => '<i class="fa-solid fa-star"></i>').join('');
            const sentiment = item['情感'] || '中立';
            const borderColor = sentiment === '利多' ? '#00ff88' : sentiment === '利空' ? '#ff0055' : '#94a3b8';
            const card = document.createElement('div');
            card.className = 'news-card card-base p-7 dark:bg-obsidian-800';
            card.style.borderLeftColor = borderColor;
            card.innerHTML = `
                <div class="flex justify-between items-start mb-5 font-mono text-[10px] font-bold">
                    <div class="flex flex-wrap gap-2">
                        <span class="px-2.5 py-1 bg-slate-100 dark:bg-obsidian-900 text-slate-600 dark:text-neon-cyan/80 rounded border border-slate-200 dark:border-neon-cyan/20 uppercase">${escapeHtml(item['來源'] || '')}</span>
                        <span class="px-2.5 py-1 bg-slate-100 dark:bg-obsidian-900 text-slate-600 dark:text-slate-400 rounded border border-slate-200 dark:border-obsidian-600 uppercase">${escapeHtml(getLocalRegion(item['區域'] || ''))}</span>
                        <span class="px-2.5 py-1 badge-${sentiment} rounded">${escapeHtml(sentimentLabel[sentiment] || sentiment)}</span>
                    </div>
                    <div class="flex gap-0.5 text-yellow-500 dark:text-neon-gold text-sm mt-0.5">${stars}</div>
                </div>
                <h3 class="text-xl md:text-2xl font-black mb-2 leading-snug text-high-contrast">${escapeHtml(getTitle(item))}</h3>
                <div class="text-[10px] font-mono text-slate-400 dark:text-slate-500 mb-5 flex items-center gap-1.5">
                    <i class="fa-regular fa-calendar text-[9px]"></i> ${escapeHtml(item['發布日期'] || '')}
                </div>
                <div class="card-body bg-slate-50 dark:bg-obsidian-900/50 p-5 rounded-xl border border-slate-200 dark:border-obsidian-700 mb-6">
                    <p class="text-sm leading-relaxed text-mid-contrast font-medium">${escapeHtml(getSummary(item))}</p>
                </div>
                <div class="flex justify-end items-center">
                    <a href="${escapeHtml(item['連結'] || '#')}" target="_blank" class="bg-blue-600 dark:bg-obsidian-700 dark:border dark:border-obsidian-600 text-white text-[10px] font-mono font-bold px-4 py-2 rounded-lg flex items-center gap-2">
                        ${escapeHtml(i18n[currentLang]['card-link'])} <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function updateStats(items) {
        document.getElementById('statCount').textContent = items.length;
        document.getElementById('statDays').textContent = new Set(items.map(i => (i['發布日期']||'').slice(0,10))).size;
        document.getElementById('statSources').textContent = new Set(items.map(i => i['來源'])).size;
    }

    // ── 地區篩選（依目前選定區間內實際出現的地區動態列出，可複選）──
    let dateFilteredItems = [];
    const selectedRegions = new Set();

    function renderRegionOptions(items) {
        const counts = {};
        items.forEach(i => {
            const r = i['區域'] || '未分類';
            counts[r] = (counts[r] || 0) + 1;
        });
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        const container = document.getElementById('regionOptions');
        container.innerHTML = sorted.map(([region, count]) => {
            const label = getLocalRegion(region);
            // data-region-name 同時放中文原名+目前語言顯示名，兩者都能被搜尋框比對到
            return `
            <label class="region-option flex items-center justify-between gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-obsidian-900 cursor-pointer text-xs" data-region-name="${escapeHtml(region + ' ' + label)}">
                <span class="flex items-center gap-2 text-high-contrast">
                    <input type="checkbox" class="region-checkbox accent-blue-600" value="${escapeHtml(region)}" ${selectedRegions.has(region) ? 'checked' : ''}>
                    ${escapeHtml(label)}
                </span>
                <span class="text-mid-contrast font-mono text-[10px]">${count}</span>
            </label>
        `;
        }).join('') || `<div class="text-center text-mid-contrast text-xs py-4">${escapeHtml(i18n[currentLang]['empty'])}</div>`;

        container.querySelectorAll('.region-checkbox').forEach(cb => {
            cb.addEventListener('change', () => {
                if (cb.checked) selectedRegions.add(cb.value); else selectedRegions.delete(cb.value);
                updateRegionBadge();
                applyRegionFilter();
            });
        });
    }

    function updateRegionBadge() {
        const badge = document.getElementById('regionBadge');
        badge.textContent = selectedRegions.size;
        badge.classList.toggle('hidden', selectedRegions.size === 0);
    }

    function applyRegionFilter() {
        const filtered = selectedRegions.size === 0
            ? dateFilteredItems
            : dateFilteredItems.filter(i => selectedRegions.has(i['區域'] || '未分類'));
        renderCards(filtered);
        updateStats(filtered);
    }

    async function applyRange(startStr, endStr) {
        const loading = document.getElementById('loadingState');
        const error = document.getElementById('errorState');
        loading.classList.remove('hidden');
        error.classList.add('hidden');
        document.getElementById('newsContainer').innerHTML = '';
        document.getElementById('emptyState').classList.add('hidden');
        try {
            const months = monthsBetween(startStr, endStr).filter(m => indexData.months.includes(m));
            const chunks = await Promise.all(months.map(loadMonth));
            const merged = chunks.flat().filter(item => {
                const d = (item['發布日期'] || '').slice(0, 10);
                return d >= startStr && d <= endStr;
            });
            merged.sort((a, b) => (b['發布日期']||'').localeCompare(a['發布日期']||''));
            dateFilteredItems = merged;
            currentMonths = months;
            if (currentLang !== 'cn') {
                await Promise.all(months.map(loadI18nMonth));
            }
            renderRegionOptions(merged);
            applyRegionFilter();
        } catch (e) {
            error.classList.remove('hidden');
        } finally {
            loading.classList.add('hidden');
        }
    }

    function setPresetActive(days) {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.days == days));
    }

    // ── 地區篩選面板開關/搜尋/全選/清除 ──
    document.getElementById('regionBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('regionPanel').classList.toggle('hidden');
    });
    document.addEventListener('click', (e) => {
        const panel = document.getElementById('regionPanel');
        if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target.id !== 'regionBtn') {
            panel.classList.add('hidden');
        }
    });
    document.getElementById('regionSearch').addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        document.querySelectorAll('.region-option').forEach(el => {
            el.style.display = el.dataset.regionName.toLowerCase().includes(q) ? '' : 'none';
        });
    });
    document.getElementById('regionSelectAll').addEventListener('click', () => {
        document.querySelectorAll('.region-option:not([style*="display: none"]) .region-checkbox').forEach(cb => {
            cb.checked = true;
            selectedRegions.add(cb.value);
        });
        updateRegionBadge();
        applyRegionFilter();
    });
    document.getElementById('regionClearAll').addEventListener('click', () => {
        selectedRegions.clear();
        document.querySelectorAll('.region-checkbox').forEach(cb => cb.checked = false);
        updateRegionBadge();
        applyRegionFilter();
    });
    document.getElementById('retryBtn').addEventListener('click', () => location.reload());

    applyChromeI18n();

    let fp;
    async function init() {
        try {
            indexData = await loadIndex();
        } catch (e) {
            document.getElementById('errorState').classList.remove('hidden');
            return;
        }
        if (!indexData.months.length) {
            document.getElementById('emptyState').classList.remove('hidden');
            return;
        }

        const today = new Date();
        const todayStr = fmt(today);
        const earliestMonth = indexData.months[indexData.months.length - 1];

        fp = flatpickr('#rangePicker', {
            mode: 'range',
            dateFormat: 'Y-m-d',
            disableMobile: true,
            onChange: function(selectedDates) {
                if (selectedDates.length === 2) {
                    applyRange(fmt(selectedDates[0]), fmt(selectedDates[1]));
                    setPresetActive(null);
                }
            }
        });

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const days = btn.dataset.days;
                let start;
                if (days === 'all') {
                    start = new Date(earliestMonth + '-01');
                } else {
                    start = new Date(today);
                    start.setDate(start.getDate() - parseInt(days));
                }
                fp.setDate([start, today], false);
                applyRange(fmt(start), todayStr);
                setPresetActive(days);
            });
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            selectedRegions.clear();
            updateRegionBadge();
            const start = new Date(today); start.setDate(start.getDate() - 7);
            fp.setDate([start, today], false);
            applyRange(fmt(start), todayStr);
            setPresetActive('7');
        });

        // 預設：近 7 天
        const defaultStart = new Date(today); defaultStart.setDate(defaultStart.getDate() - 7);
        fp.setDate([defaultStart, today], false);
        setPresetActive('7');
        applyRange(fmt(defaultStart), todayStr);
    }

    init();
</script>
</body>
</html>
